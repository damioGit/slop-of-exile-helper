<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slop of Exile Helper</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --panel-2: #efe9dd; --text: #1d1a16; --muted: #6b6358; --line: #ddd3c2;
  --accent: #a4561c; --accent-2: #c9782f; --good: #2f7d4a; --bad: #b2302a; --warn: #b07a12; --info: #3f6c9e;
  --fire: #c4471d; --cold: #2f7fb8; --light: #b8950f; --chaos: #8a3f9e; --phys: #7a6a58;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  --radius: 10px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120f; --panel: #1d1a16; --panel-2: #26221c; --text: #ece5d8; --muted: #a39886; --line: #3a342b;
    --accent: #e08a3c; --accent-2: #f0a35a; --good: #5cbf7c; --bad: #e0605a; --warn: #e0b040; --info: #6fa3dc;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #14120f; --panel: #1d1a16; --panel-2: #26221c; --text: #ece5d8; --muted: #a39886; --line: #3a342b;
  --accent: #e08a3c; --accent-2: #f0a35a; --good: #5cbf7c; --bad: #e0605a; --warn: #e0b040; --info: #6fa3dc;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); }
a { color: var(--accent); }
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .5em .9em; cursor: pointer;
  font-weight: 600; white-space: nowrap;
}
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button:disabled { opacity: .5; cursor: progress; }
textarea, input[type=text], select {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .5em .6em; width: 100%;
}
textarea { font-family: var(--mono); font-size: 12px; min-height: 90px; resize: vertical; }
header {
  position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
header h1 span { color: var(--accent); }
.badge { display: inline-flex; gap: 6px; align-items: center; background: var(--panel-2); border-radius: 999px;
  padding: 3px 10px; font-size: 13px; color: var(--muted); }
.badge b { color: var(--text); }
.spacer { flex: 1; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; margin-bottom: 14px; }
.panel h2 { font-size: 15px; margin: 0 0 10px; }
.panel h3 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }
.goals label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.goals input { width: 100%; accent-color: var(--accent); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 4px 0 14px; scrollbar-width: thin; }
nav.tabs button { background: transparent; color: var(--muted); border: 1px solid transparent; font-weight: 600; }
nav.tabs button.on { background: var(--panel); color: var(--text); border-color: var(--line); box-shadow: var(--shadow); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gauge { display: grid; grid-template-columns: 90px 1fr 60px; gap: 8px; align-items: center; margin: 5px 0; font-size: 13px; }
.bar { height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
.bar .cap { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .5; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.finding { border: 1px solid var(--line); border-left: 4px solid var(--info); border-radius: 8px; padding: 10px 12px; margin: 8px 0;
  background: var(--panel); }
.finding.bad { border-left-color: var(--bad); } .finding.warn { border-left-color: var(--warn); }
.finding h4 { margin: 0 0 4px; font-size: 14.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.finding p { margin: 3px 0; font-size: 13.5px; }
.finding ul { margin: 4px 0 0 18px; padding: 0; font-size: 13.5px; }
.pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 1px 7px; border-radius: 99px;
  background: var(--panel-2); color: var(--muted); }
.pill.sure { color: var(--good); } .pill.likely { color: var(--warn); } .pill.check { color: var(--info); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel-2); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, var(--panel)); }
.chip.dead { text-decoration: line-through; color: var(--bad); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; background: var(--panel-2); padding: 8px; border-radius: 8px; margin: 6px 0; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.slotlist button { margin: 0 6px 6px 0; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.toast.on { opacity: .95; }
.busy { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.step { display: flex; gap: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: var(--panel); }
.stepn { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
button.small { padding: .25em .6em; font-size: 12.5px; }
.treebox { position: relative; height: 520px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); touch-action: none; }
.treebox canvas { display: block; cursor: grab; }
.treetip { position: absolute; display: none; max-width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; box-shadow: var(--shadow); pointer-events: none; }
.market { border-left: 3px solid var(--info); padding: 6px 10px; margin-top: 6px; background: var(--panel-2); border-radius: 6px; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
@media (max-width: 600px) {
  main { padding: 10px; } header { padding: 8px 10px; } .gauge { grid-template-columns: 70px 1fr 48px; }
  .tile .v { font-size: 17px; } th, td { padding: 5px 6px; }
}
</style>
</head>
<body>
<header>
  <h1>Slop of <span>Exile</span> Helper</h1>
  <span id="buildBadge" class="badge">brak buildu</span>
  <span class="spacer"></span>
  <label class="small muted" id="mainSkillWrap" style="display:none">Główny skill: <select id="mainSkill" style="width:auto;padding:.3em .5em"></select></label>
  <button class="ghost" id="btnSync" title="Pobierz postać jeszcze raz z poe.ninja" style="display:none">⟳ Synchronizuj</button>
  <button class="ghost" id="btnExport" title="Skopiuj kod buildu do PoB">Kod PoB</button>
  <button class="ghost" id="btnReset" title="Cofnij zastosowane zmiany">Reset</button>
  <button class="ghost" id="btnTheme" title="Motyw">◐</button>
</header>
<main>
  <details class="panel" id="loadPanel" open>
    <summary><b>Wczytaj build</b> <span id="kbInfo" class="muted small"></span></summary>
    <textarea id="code" style="margin-top:10px" placeholder="Wklej kod z Path of Building (Import/Export → Generate → Copy) albo XML"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="btnLoad">Wczytaj</button>
    </div>
    <h3>…albo zaimportuj postać z profilu (poe.ninja)</h3>
    <div class="row">
      <input type="text" id="impAcc" placeholder="Konto#1234 albo link do postaci z poe.ninja" style="flex:2;min-width:200px">
      <input type="text" id="impName" placeholder="Nazwa postaci" style="flex:1;min-width:140px">
      <button id="btnImport">Importuj</button>
    </div>
    <p class="muted small">Działa dla publicznych postaci, które poe.ninja już zna (ladder, publiczny profil). Po zmianach w grze użyj „Synchronizuj”.</p>
  </details>

  <section class="panel">
    <div class="goals">
      <div><label>Obrażenia <b id="gDamageV">2</b></label><input id="gDamage" type="range" min="0" max="3" step="0.5" value="2"></div>
      <div><label>Przetrwanie <b id="gSurviveV">2</b></label><input id="gSurvive" type="range" min="0" max="3" step="0.5" value="2"></div>
      <div><label>Prędkość ruchu <b id="gSpeedV">1</b></label><input id="gSpeed" type="range" min="0" max="3" step="0.5" value="1"></div>
      <div><label>Mana <b id="gManaV">1</b></label><input id="gMana" type="range" min="0" max="3" step="0.5" value="1"></div>
      <div><label>Budżet (divine) <span class="muted">puste = bez limitu</span></label><input id="gBudget" type="text" inputmode="decimal" placeholder="np. 5"></div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="assistant" class="on">Asystent</button>
    <button data-tab="checkup">Problemy</button>
    <button data-tab="overview">Przegląd</button>
    <button data-tab="skills">Skille</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="tree">Drzewko</button>
    <button data-tab="combo">Synergie</button>
    <button data-tab="plan">Plan</button>
    <button data-tab="search">Szukaj</button>
  </nav>
  <div id="view"><div class="panel empty">Wklej kod buildu, żeby zacząć.</div></div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, d = 0) => v == null ? "–" : (typeof v === "number" ? v.toLocaleString("pl-PL", {maximumFractionDigits: d}) : esc(v));
const pct = v => v == null ? "–" : `<span class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : ""}${fmt(v, 1)}%</span>`;
const STAT_PL = {CombinedDPS: "DPS (łączny)", TotalDPS: "DPS (hit)", TotalEHP: "EHP", Life: "Życie", EnergyShield: "Energy Shield",
  Mana: "Mana", Spirit: "Spirit", Evasion: "Evasion", Armour: "Armour", EvadeChance: "Unik %", DeflectChance: "Deflect %",
  DeflectionRating: "Deflection", FireResist: "Res. ogień", ColdResist: "Res. zimno", LightningResist: "Res. błyskawice",
  ChaosResist: "Res. chaos", Speed: "Ataki/s", CritChance: "Crit %", CritMultiplier: "Crit mnożnik", AverageHit: "Średni hit",
  MovementSpeedMod: "Prędkość ruchu", SpiritUnreserved: "Wolny spirit", SpiritReserved: "Zarezerwowany spirit",
  ManaPerSecondCost: "Koszt many/s", ManaRegenRecovery: "Regen many/s", Str: "Siła", Dex: "Zręczność", Int: "Inteligencja"};
const SLOTS = ["Weapon 1", "Weapon 2", "Helmet", "Body Armour", "Gloves", "Boots", "Amulet", "Ring 1", "Ring 2", "Belt"];

let state = {tab: "assistant", loaded: false, overview: null, cache: {}};

function toast(msg, ms) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms || (msg.startsWith("Błąd") ? 9000 : 2500)); }
function goals() {
  const b = parseFloat(($("#gBudget").value || "").replace(",", "."));
  return {damage: +$("#gDamage").value, survive: +$("#gSurvive").value, speed: +$("#gSpeed").value, mana: +$("#gMana").value,
          budget: isNaN(b) ? null : b};
}
async function api(path, opts = {}) {
  const r = await fetch(path, opts.body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(opts.body)} : {});
  const j = await r.json();
  if (!r.ok || (j && j.error)) throw new Error(j.error || r.statusText);
  return j;
}
const q = o => new URLSearchParams(Object.entries(o).filter(([, v]) => v != null && v !== "")).toString();

async function busy(btn, fn) {
  const old = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="busy"></span> ${old}`; }
  try { return await fn(); } catch (e) { toast("Błąd: " + e.message); console.error(e); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}

function diffTable(changes) {
  const rows = Object.entries(changes || {});
  if (!rows.length) return `<p class="muted small">Brak zmian w statach.</p>`;
  return `<div class="tablewrap"><table><tr><th>Stat</th><th class="n">Przed</th><th class="n">Po</th><th class="n">Zmiana</th></tr>${
    rows.map(([k, [a, b, d, p]]) => `<tr><td>${esc(STAT_PL[k] || k)}</td><td class="n">${fmt(a, 1)}</td><td class="n">${fmt(b, 1)}</td><td class="n">${p == null ? fmt(d, 1) : pct(p)}</td></tr>`).join("")
  }</table></div>`;
}
function notes(list) { return (list || []).length ? `<ul class="small muted">${list.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""; }

async function applySteps(steps, btn) {
  if (!steps || !steps.length) return;
  await busy(btn, async () => {
    const r = await api("/api/apply", {body: {steps}});
    state.cache = {};
    await refreshBadge();
    toast("Zastosowano. Nowy kod buildu w przycisku „Kod PoB”.");
    render();
    return r;
  });
}

// ---------------------------------------------------------------- views
const views = {
  async assistant(el) {
    const skills = await api("/api/skills");
    const examples = [
      "Nie jestem w stanie oneshotować moba, co zrobić żeby bić mocniej?",
      "Jak zwiększyć DPS za 5 div?",
      "Ciągle umieram na bossach, co poprawić?",
      "Brakuje mi many",
    ];
    el.innerHTML = `<div class="panel"><h2>Zapytaj o swój build</h2>
      <p class="muted small">Napisz po swojemu, co Cię boli. Asystent policzy w Path of Building, co konkretnie zmienić, ile to da i ile kosztuje.</p>
      <textarea id="q" style="min-height:70px;font-family:var(--sans);font-size:15px" placeholder="np. nie oneshotuję moba, jak bić mocniej Cometem?"></textarea>
      <div class="chips" style="margin:8px 0">${examples.map(x => `<button class="ghost small ex" style="font-weight:500">${esc(x)}</button>`).join("")}</div>
      <div class="row">
        <label class="small muted">Skill: <select id="qSkill" style="width:auto">${skills.map(s => `<option value="${s.group}:${s.skill}" ${s.main ? "selected" : ""}>${esc(s.label)}${s.main ? " (główny)" : ""}</option>`).join("")}</select></label>
        <label class="small muted">Cel: <select id="qGoal" style="width:auto"><option value="">z pytania</option><option value="dps">DPS</option><option value="hit">pojedynczy hit (oneshot)</option><option value="survive">przetrwanie</option><option value="clear">clear map</option><option value="mana">mana</option><option value="speed">prędkość ruchu</option></select></label>
        <button id="btnAsk">Zapytaj</button>
      </div>
      <p class="muted small">Liczenie trwa ~20–60 s: sprawdzam supporty, drzewko, gear i unikaty. Budżet bierzemy z pola nad zakładkami albo z pytania („za 5 div”).</p></div>
      <div id="answer"></div>`;
    el.querySelectorAll(".ex").forEach(b => b.onclick = () => { $("#q").value = b.textContent; });
    $("#btnAsk").onclick = e => busy(e.target, async () => {
      const g = goals();
      const r = await api("/api/ask", {body: {question: $("#q").value, skill: $("#qSkill").value, goal: $("#qGoal").value || null, budget: g.budget}});
      renderAnswer(r);
    });
  },

  async tree(el) {
    el.innerHTML = `<div class="panel"><h2>Drzewko pasywne</h2>
      <p class="muted small">Przeciągaj myszką, kółko = zoom. Pomarańczowe = wzięte, fioletowe = wzięte na drugi zestaw broni, niebieskie = podświetlona ścieżka. Najedź na pasywkę, żeby zobaczyć, co daje.</p>
      <div id="treeBox" class="treebox"><canvas id="treeCanvas"></canvas><div id="treeTip" class="treetip"></div></div>
      <div id="treeInfo" class="small" style="margin-top:8px"></div></div>
      <div class="grid2">
      <div class="panel"><h2>Co warto wziąć</h2><div class="row"><select id="tMetric" style="width:auto"><option value="dps">DPS</option><option value="ehp">EHP</option><option value="life">Życie</option><option value="es">Energy Shield</option><option value="movement">Prędkość ruchu</option></select><button id="btnRank">Policz</button></div><div id="rankOut"></div></div>
      <div class="panel"><h2>Co można zwolnić</h2><p class="muted small">Pasywki, których zwolnienie najmniej kosztuje.</p><button id="btnRespec">Policz</button><div id="respecOut"></div></div></div>
      <div class="panel"><h2>Optymalizator drzewka</h2><p class="muted small">Zwalnia słabe pasywki i bierze mocne, każdy ruch sprawdzony w PoB (~10–30 s).</p><button id="btnTree">Optymalizuj</button><div id="treeOut"></div></div>`;
    const data = await api("/api/tree");
    const tv = treeView($("#treeBox"), data);
    const showNode = async (id) => {
      const r = await api("/api/node_path?" + q({id}));
      tv.highlight(r.path.length ? r.path : [id], id);
      const n = r.node;
      $("#treeInfo").innerHTML = n ? `<b>${esc(n.name)}</b> <span class="muted">(${esc(n.type)}${n.alloc ? ", wzięta" : `, ${r.path.length} pkt ścieżki`})</span><br>${(n.stats || []).map(esc).join("<br>")}` : "";
      $("#treeBox").scrollIntoView({behavior: "smooth", block: "center"});
    };
    const statsCell = x => `<div class="small muted">${(x.stats || []).map(esc).join("<br>")}</div>`;
    $("#btnRank").onclick = e => busy(e.target, async () => {
      const metric = $("#tMetric").value;
      const r = await api("/api/rank_passives?" + q({metric}));
      const other = metric === "dps" ? ["d_TotalEHP", "EHP"] : ["d_MainDPS", "DPS"];
      $("#rankOut").innerHTML = `<div class="tablewrap"><table><tr><th>Pasywka i co daje</th><th class="n">Pkt</th><th class="n">Zysk</th><th class="n">${other[1]} Δ</th><th></th></tr>${
        r.map(x => `<tr><td><b>${esc(x.node)}</b>${x.not_calculated ? ' <span class="pill check">część efektu PoB nie liczy</span>' : ""}${statsCell(x)}</td><td class="n">${x.points}</td><td class="n">${pct(x.gain_pct)}</td><td class="n">${fmt(x[other[0]])}</td><td><button class="ghost small" data-node="${x.id}">pokaż</button></td></tr>`).join("")}</table></div>`;
      $("#rankOut").querySelectorAll("[data-node]").forEach(b => b.onclick = () => showNode(+b.dataset.node));
    });
    $("#btnRespec").onclick = e => busy(e.target, async () => {
      const r = await api("/api/rank_respec");
      $("#respecOut").innerHTML = `<p class="small">Punkty: ${r.points.used} wydane z ${r.points.available}</p><div class="tablewrap"><table><tr><th>Pasywka</th><th class="n">Zwalnia</th><th class="n">Strata DPS</th><th class="n">EHP Δ</th><th></th></tr>${
        r.cheapest_refunds.map(x => `<tr><td><b>${esc(x.node)}</b>${x.not_calculated ? '<div class="small muted">część efektu PoB nie liczy, oceń sam</div>' : ""}</td><td class="n">${x.points_freed}</td><td class="n">${fmt(x.loss_pct, 2)}%</td><td class="n">${fmt(x.d_TotalEHP)}</td><td><button class="ghost small" data-node="${x.id}">pokaż</button></td></tr>`).join("")}</table></div>
        ${r.inactive_weapon_set_nodes.length ? `<p class="muted small">${r.inactive_weapon_set_nodes.length} pasywek jest na drugim zestawie broni i liczy się tylko, gdy go trzymasz.</p>` : ""}`;

const wiki = name => `https://www.poe2wiki.net/index.php?search=${encodeURIComponent(name)}`;
function findingDetails(d) {
  if (!d || !Object.keys(d).length) return "";
  let body = "";
  if (Array.isArray(d.nodes)) body = `<div class="chips">${d.nodes.map(n => `<a class="chip" target="_blank" href="${wiki(n)}">${esc(n)}</a>`).join("")}</div>`;
  else if (d.nodes) body = Object.entries(d.nodes).map(([n, st]) => `<p class="small"><a target="_blank" href="${wiki(n)}"><b>${esc(n)}</b></a>: ${esc([].concat(st).join("; "))}</p>`).join("");
  else if (d.mods) body = `<ul class="small">${d.mods.map(m => `<li><b>${esc(m.slot)}</b> (${esc(m.item.split(",")[0])}): ${esc(m.mod)}</li>`).join("")}</ul>`;
  else if (d.gems) body = `<ul class="small">${d.gems.map(g => `<li>${esc(g.gem)}: poziom ${g.level}</li>`).join("")}</ul>`;
  else body = `<p class="small">${Object.entries(d).map(([k, v]) => `${esc(k)}: ${esc(typeof v === "object" ? JSON.stringify(v) : v)}`).join(" · ")}</p>`;
  return `<details><summary>szczegóły</summary>${body}<p class="muted small">Klik w nazwę otwiera opis na poe2wiki.</p></details>`;
}

function marketCard(m) {
  if (!m) return "";
  if (m.error) return `<div class="small muted">Rynek: ${esc(m.error)}</div>`;
  const b = m.best;
  const link = m.link ? ` <a target="_blank" href="${m.link}">otwórz wyszukiwanie na trade</a>` : "";
  return `<div class="market"><b>Na rynku:</b> ${esc(m.verdict)}${link}
    ${b ? `<div class="small"><b>${esc(b.name)}</b> · ${esc(b.price)}${b.price_divine != null ? ` (≈${fmt(b.price_divine, 2)} div)` : ""} · ${pct(b.dps_pct)} DPS · ${pct(b.ehp_pct)} EHP
      <pre>${esc([...(b.implicits || []), ...(b.grants_skill || []).map(x => "Grants Skill: " + x), "--", ...(b.mods || [])].join("\n"))}</pre></div>` : ""}
    ${m.warning ? `<div class="small muted">${esc(m.warning)}</div>` : ""}
    <div class="small muted">Szukane: ${esc((m.searched || []).join(" + "))} · znalezionych ofert: ${m.found}</div></div>`;
}

    ${r.all_together ? `<div class="finding"><h4>Wszystko, co da się zastosować, naraz (zmierzone razem)</h4><p>${esc(r.all_together.gain)}</p><button id="btnAll">Zastosuj wszystko</button></div>` : ""}
    ${r.look_for_on_gear.length ? `<h3>Na nowym gearze szukaj</h3><ul class="small">${r.look_for_on_gear.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <p class="muted small">Policzone w ${r.seconds} s. „Zastosuj” zmienia build w appce. „Kod PoB” na górze daje kod do wklejenia w Path of Building.</p></div>`;
  out.querySelectorAll("[data-apply]").forEach(b => b.onclick = ev => applySteps(r.steps[+b.dataset.apply].apply, ev.target));
  out.querySelectorAll("[data-tree]").forEach(b => b.onclick = async () => {
    state.tab = "tree"; await render();
    const hit = (await api("/api/kb/search?" + q({q: b.dataset.tree, kind: "node", limit: 5}))).find(x => x.name === b.dataset.tree);
    if (hit && state.showNode) state.showNode(+hit.ref);
  });
  const all = $("#btnAll"); if (all) all.onclick = ev => applySteps(r.all_together.steps, ev.target);
  out.scrollIntoView({behavior: "smooth"});
}

function treeView(box, data) {
  const canvas = box.querySelector("canvas"), tip = box.querySelector(".treetip"), ctx = canvas.getContext("2d");
  const nodes = data.nodes, byId = new Map(nodes.map(n => [n.id, n]));
  const alloc = new Map(Object.entries(data.allocated).map(([k, v]) => [+k, v]));
  let hl = new Set(), target = null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes) { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); }
  let scale = 1, ox = 0, oy = 0;
  const css = getComputedStyle(document.documentElement);
  const col = v => css.getPropertyValue(v).trim();
  function fit() {
    const w = box.clientWidth, h = box.clientHeight, dpr = devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.width = w + "px"; canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // start zoomed on the allocated part of the tree
    const a = nodes.filter(n => alloc.has(n.id));
    const src = a.length ? a : nodes;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const n of src) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); }
    scale = Math.min(w / (x1 - x0 + 1500), h / (y1 - y0 + 1500));
    ox = w / 2 - (x0 + x1) / 2 * scale; oy = h / 2 - (y0 + y1) / 2 * scale;
  }
  const R = n => ({Keystone: 10, Notable: 6.5, Mastery: 5, Socket: 6.5, AscendClassStart: 8})[n.type] || 3.2;
  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.fillStyle = col("--panel-2"); ctx.fillRect(0, 0, w, h);
    const line = col("--line"), acc = col("--accent"), info = col("--info"), muted = col("--muted"), chaos = col("--chaos");
    ctx.lineWidth = Math.max(0.6, scale * 6);
    for (const n of nodes) for (const id of n.linked || []) {
      if (id < n.id) continue; const m = byId.get(id); if (!m) continue;
      const both = alloc.has(n.id) && alloc.has(id), path = hl.has(n.id) && (hl.has(id) || alloc.has(id)) || hl.has(id) && alloc.has(n.id);
      ctx.strokeStyle = path ? info : both ? acc : line; ctx.globalAlpha = path || both ? 1 : 0.55;
      ctx.beginPath(); ctx.moveTo(n.x * scale + ox, n.y * scale + oy); ctx.lineTo(m.x * scale + ox, m.y * scale + oy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const n of nodes) {
      const x = n.x * scale + ox, y = n.y * scale + oy;
      if (x < -20 || y < -20 || x > w + 20 || y > h + 20) continue;
      const r = Math.max(1.5, R(n) * Math.min(2.2, scale * 18));
      const ws = alloc.get(n.id);
      ctx.fillStyle = n.id === target ? "#fff" : hl.has(n.id) ? info : alloc.has(n.id) ? (ws && ws !== data.active_weapon_set ? chaos : acc) : muted;
      ctx.globalAlpha = alloc.has(n.id) || hl.has(n.id) ? 1 : 0.5;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (n.id === target) { ctx.strokeStyle = info; ctx.lineWidth = 2; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
  }
  function nodeAt(px, py) {
    let best = null, bd = 1e9;
    for (const n of nodes) {
      const d = Math.hypot(n.x * scale + ox - px, n.y * scale + oy - py);
      const r = Math.max(5, R(n) * Math.min(2.2, scale * 18) + 3);
      if (d < r && d < bd) { bd = d; best = n; }
    }
    return best;
  }
  let drag = null;
  canvas.onmousedown = e => { drag = {x: e.clientX, y: e.clientY, ox, oy, moved: false}; };
  window.addEventListener("mouseup", () => { drag = null; });
  canvas.onmousemove = e => {
    const rect = canvas.getBoundingClientRect(), px = e.clientX - rect.left, py = e.clientY - rect.top;
    if (drag) { ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y; drag.moved = true; tip.style.display = "none"; draw(); return; }
    const n = nodeAt(px, py);
    if (n && n.type !== "Normal" || n && scale > 0.05) {
      tip.innerHTML = `<b>${esc(n.name)}</b>${alloc.has(n.id) ? ' <span class="pill sure">wzięta</span>' : ""}<br>${(n.stats || []).map(esc).join("<br>")}`;
      tip.style.display = "block"; tip.style.left = Math.min(px + 14, canvas.clientWidth - 260) + "px"; tip.style.top = (py + 14) + "px";
    } else tip.style.display = "none";
  };
  canvas.onmouseleave = () => { tip.style.display = "none"; };
  canvas.onwheel = e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect(), px = e.clientX - rect.left, py = e.clientY - rect.top;
    const f = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    ox = px - (px - ox) * f; oy = py - (py - oy) * f; scale *= f; draw();
  };
  // touch: one finger pans
  canvas.ontouchstart = e => { const t = e.touches[0]; drag = {x: t.clientX, y: t.clientY, ox, oy}; };
  canvas.ontouchmove = e => { e.preventDefault(); const t = e.touches[0]; if (drag) { ox = drag.ox + t.clientX - drag.x; oy = drag.oy + t.clientY - drag.y; draw(); } };
  fit(); draw();
  window.addEventListener("resize", () => { fit(); draw(); });
  return {
    highlight(ids, id) {
      hl = new Set(ids); target = id;
      const n = byId.get(id);
      if (n) { const w = canvas.clientWidth, h = canvas.clientHeight; scale = Math.max(scale, 0.08); ox = w / 2 - n.x * scale; oy = h / 2 - n.y * scale; }
      draw();
    },
  };
}

async function slotView(slot) {
  const out = $("#slotOut");
  out.innerHTML = `<div class="panel"><span class="busy"></span> ${esc(slot)}…</div>`;
  const g = goals();
  const gq = q({slot, damage: g.damage, survive: g.survive});
  try {
    const [item, up, uq] = await Promise.all([api("/api/item?" + q({slot})), api("/api/mod_upgrades?" + gq), api("/api/uniques?" + gq).catch(() => null)]);
    out.innerHTML = `<div class="panel"><h2>${esc(item.slot)}: ${esc(item.name)}</h2><div class="grid2">
      <div><pre>${esc(item.raw.replace(/\{[^}]*\}/g, ""))}</pre>
        <h3>Sprawdź inny item (wklej z gry lub trade)</h3><textarea id="wiText" placeholder="Ctrl+C na itemie w grze i wklej tutaj"></textarea><button id="btnWI" style="margin-top:6px">Porównaj</button><div id="wiOut"></div></div>
      <div><h3>Lepsze mody na tym itemie</h3>${up.corrupted ? "<p>Item jest skorumpowany, nie da się go zmienić.</p>" :
        up.upgrades.length ? `<div class="tablewrap"><table><tr><th>Zamień</th><th>Na</th><th class="n">DPS</th><th class="n">EHP</th></tr>${up.upgrades.map(u => `<tr><td class="small">${esc(u.replace)}<div class="muted">${esc(u.replace_as)}</div></td><td class="small"><b>${esc(u.with)}</b>${u.essence.length ? `<div class="muted">esencja: ${esc(u.essence.join(", "))}</div>` : ""}</td><td class="n">${pct(u.dps_pct)}</td><td class="n">${pct(u.ehp_pct)}</td></tr>`).join("")}</table></div>` : "<p class='muted'>Nic lepszego w puli modów.</p>"}
        ${up.not_changeable_or_unknown.length ? `<p class="muted small">Spoza zwykłej puli: ${esc(up.not_changeable_or_unknown.join("; "))}</p>` : ""}
        <button class="ghost" id="btnIdeal">Pokaż idealny item na ten slot</button><div id="idealOut"></div>
        <h3>Ulepszenie z rynku</h3><p class="muted small">Szuka na trade itemu, który zachowa najmocniejsze mody Twojego i doda wybrany mod. Każda oferta przeliczona w PoB. Budżet z pola nad zakładkami.</p>
        <div class="row"><select id="mktWanted" style="flex:1"><option value="">(tylko zachowaj obecne mody)</option>${up.upgrades.map(u => `<option>${esc(u.with)}</option>`).join("")}</select><button class="ghost" id="btnMarket">Szukaj na rynku</button></div><div id="marketOut"></div>
        ${uq ? `<h3>Unikaty na ten slot</h3><div class="tablewrap"><table>${uq.ranking.slice(0, 8).map(u => `<tr><td>${esc(u.unique)}${u.not_calculated ? ' <span class="pill check">częściowo</span>' : ""}</td><td class="n">${pct(u.dps_pct)}</td><td class="n">${pct(u.ehp_pct)}</td><td class="n small">${u.price ? esc(u.price.text) : "–"}</td></tr>`).join("")}</table></div><p class="muted small">${esc(uq.note)}</p>` : ""}
      </div></div></div>`;
    $("#btnWI").onclick = e => busy(e.target, async () => {
      const r = await api("/api/whatif_item", {body: {slot, item_text: $("#wiText").value}});
      $("#wiOut").innerHTML = diffTable(r.changes) + notes(r.notes);
    });
    $("#btnMarket").onclick = e => busy(e.target, async () => {
      const g = goals();
      const m = await api("/api/find_upgrade", {body: {slot, wanted: $("#mktWanted").value, budget: g.budget, damage: g.damage, survive: g.survive, speed: g.speed}});
      const best = m.items.find(x => x.score > 0.5);
      $("#marketOut").innerHTML = marketCard({...m, searched: m.searched_mods, best, verdict: best ? `${best.name} za ${best.price}` : "nic lepszego od obecnego w budżecie"})
        + (m.items.length ? `<div class="tablewrap"><table><tr><th>Item</th><th class="n">Cena</th><th class="n">DPS</th><th class="n">EHP</th></tr>${m.items.map(x => `<tr><td class="small"><b>${esc(x.name)}</b><div class="muted">${esc((x.mods || []).join("; "))}</div></td><td class="n">${esc(x.price)}</td><td class="n">${pct(x.dps_pct)}</td><td class="n">${pct(x.ehp_pct)}</td></tr>`).join("")}</table></div>` : "");
    });
    $("#btnIdeal").onclick = e => busy(e.target, async () => {
      const r = await api("/api/ideal_item?" + gq);
      $("#idealOut").innerHTML = `<p>Sufit vs obecny: DPS ${pct(r.dps_pct)} · EHP ${pct(r.ehp_pct)}</p><ul class="small">${r.mods.map(m => `<li>${esc(m.type)}: <b>${esc(m.text)}</b> <span class="muted">(lvl ${m.level})</span></li>`).join("")}</ul>`;
    });
  } catch (e) { out.innerHTML = `<div class="panel neg">${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- shell
async function render() {
  const el = $("#view");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  if (!state.loaded && state.tab !== "search") { el.innerHTML = `<div class="panel empty">Wklej kod buildu, żeby zacząć.</div>`; return; }
  el.innerHTML = `<div class="panel"><span class="busy"></span> Liczę w Path of Building…</div>`;
  try { await views[state.tab](el); } catch (e) { el.innerHTML = `<div class="panel"><b class="neg">Błąd:</b> ${esc(e.message)}</div>`; }
}
async function refreshBadge() {
  const s = await api("/api/status");
  state.loaded = s.loaded;
  state.overview = null;
  $("#kbInfo").textContent = s.kb && s.kb.pob_version ? `· dane gry: PoB ${s.kb.pob_version}, drzewko ${s.kb.tree_version}` : "· brak bazy wiedzy: uruchom soe kb build";
  api("/api/prices").then(p => { $("#kbInfo").textContent += ` · ceny: ${p.status.league}, 1 div = ${fmt(p.status.divine_in_exalted)} ex`; }).catch(() => {});
  $("#loadPanel").open = !s.loaded;
  if (s.loaded) {
    const sk = await api("/api/skills");
    $("#mainSkillWrap").style.display = "";
    $("#mainSkill").innerHTML = sk.map(x => `<option value="${x.group}:${x.skill}" ${x.main ? "selected" : ""}>${esc(x.label)}</option>`).join("");
  }
  $("#btnSync").style.display = s.source ? "" : "none";
  if (s.source) $("#btnSync").title = `${s.source.account} / ${s.source.name} (${s.source.league}), poe.ninja: ${s.source.updated || "?"}`;
  if (s.loaded) {
    const m = s.summary;
    $("#buildBadge").innerHTML = `<b>${esc(m.ascendancy || m.class)}</b> lvl ${m.level} · ${esc(m.main_skill)} · DPS <b>${fmt(m.CombinedDPS)}</b> · EHP <b>${fmt(m.TotalEHP)}</b>`;
  }
}

$("#mainSkill").onchange = e => busy(null, async () => {
  const [group, skill] = e.target.value.split(":").map(Number);
  await api("/api/main_skill", {body: {group, skill}});
  state.cache = {}; await refreshBadge(); render(); toast("Główny skill zmieniony.");
});
$("#tabs").onclick = e => { const t = e.target.closest("button"); if (t) { state.tab = t.dataset.tab; render(); } };
$("#btnLoad").onclick = e => busy(e.target, async () => {
  const code = $("#code").value.trim();
  if (!code) return toast("Wklej kod buildu.");
  await api("/api/load", {body: {code}});
  await refreshBadge();
  $("#code").value = "";
  state.tab = "assistant";
  render();
});
$("#btnImport").onclick = e => busy(e.target, async () => {
  const ref = $("#impAcc").value.trim(), name = $("#impName").value.trim();
  if (!ref) return toast("Podaj konto (Nazwa#1234) i postać albo wklej link z poe.ninja.");
  const r = await api("/api/import", {body: {ref, name}});
  try { localStorage.setItem("soe-account", ref.includes("poe.ninja") ? "" : ref); } catch {}
  toast(`Wczytano ${r.character.name} (${r.character.class}, lvl ${r.character.level}, ${r.character.league})`);
  await refreshBadge(); state.tab = "checkup"; render();
});
$("#btnSync").onclick = e => busy(e.target, async () => {
  const r = await api("/api/resync", {body: {}});
  toast(`Zsynchronizowano ${r.character.name} (poe.ninja: ${r.character.updated || "?"})`);
  state.cache = {}; await refreshBadge(); render();
});
try { const a = localStorage.getItem("soe-account"); if (a) $("#impAcc").value = a; } catch {}
$("#btnExport").onclick = e => busy(e.target, async () => {
  const r = await api("/api/export");
  try { await navigator.clipboard.writeText(r.code); toast("Kod buildu skopiowany."); } catch { prompt("Kod buildu:", r.code); }
});
$("#btnReset").onclick = e => busy(e.target, async () => { await api("/api/reset", {body: {}}); await refreshBadge(); render(); toast("Build jak po wczytaniu."); });
$("#btnTheme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("soe-theme", next); } catch {}
};
for (const id of ["gDamage", "gSurvive", "gSpeed", "gMana"]) {
  $("#" + id).oninput = () => { $("#" + id + "V").textContent = $("#" + id).value; };
  $("#" + id).onchange = () => { if (state.tab === "checkup") render(); };
}
try { const t = localStorage.getItem("soe-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
refreshBadge().then(render).catch(() => render());
</script>
</body>
</html>
